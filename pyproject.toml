[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pu6e-reloaded"
version = "1.0.1"
description = "A Python 3.14 port of the pu6e Ultima VI world editor"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-2.0-or-later"
license-files = [
  "LICENSE",
  "NOTICE.md",
  "THIRD_PARTY_NOTICES.md",
  "docs/history/NOTICE-0.6.0.txt",
]
authors = [{name = "Jim Ursetto"}]
maintainers = [{name = "Richard Louie Orilla"}]
dependencies = [
  "numpy>=2.2",
  "PyOpenGL>=3.1.9",
  "PySide6>=6.11,<7",
]

[project.scripts]
pu6e = "pu6e:main"

[dependency-groups]
dev = ["pytest>=9"]
packaging = ["pyinstaller>=6.22"]

[tool.setuptools]
packages = ["U6", "pu6e_qt"]
py-modules = ["fastgl", "mapedit_gl", "pu6e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
